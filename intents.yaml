# ORB / JARVIS — Intent ground truth.
#
# This is the single source of truth for routing (see INTENT_ROUTING_PLAN.md).
# Adding a new capability = adding an entry here; the Layer-1 classifier, the
# Layer-2 slot extractor, and the semantic exemplar set all read from this file
# so routing logic never has to change to support a new tool.
#
# Per intent:
#   bucket       broad Layer-1 category (data | communication | media | desktop |
#                research | productivity | conversation). Fast triage routes here
#                first; the bucket narrows which intents the matcher considers.
#   handler      who executes it: registry (tool_registry) | router (handled
#                inline in server_win.process_transcript) | connector (connectors.py)
#   tool         the concrete tool/action name the handler dispatches
#   side_effects true if it changes state / acts on the world (file write, media,
#                volume, opening apps). The confidence rule (INTENT_ROUTING_PLAN
#                §confidence) says: NEVER fire a side-effects intent on a low /
#                guessed classification — confirm first. Read-only intents may
#                fire silently above the high threshold.
#   slots        parameters to extract (Layer 2). required: must be present or ask
#                ONE clarifying question. type: string|boolean|integer|enum.
#   examples     natural phrasings that should land here — INCLUDING paraphrases
#                the regex layer misses ("should I bring a jacket" -> weather).
#                These double as the embedding exemplars.

version: 1

intents:

  # ---- data ---------------------------------------------------------------
  get_weather:
    bucket: data
    handler: registry
    tool: get_weather
    side_effects: false
    # canonical: a phrase the regex router parses into this intent with default
    # slots. Its presence (on a read intent) marks the intent OFFLINE-ROUTABLE:
    # the semantic layer can fire it above the high-confidence threshold without
    # slot extraction. Slot-bearing reads (stock/research/image/...) have NO
    # canonical and fall through to the Haiku rewrite, which extracts the slot.
    canonical: what's the weather
    description: Current conditions or a forecast for a place.
    slots:
      location: {type: string, required: false, description: "City/place; empty = default location"}
      tomorrow: {type: boolean, required: false, description: "True if asking about tomorrow"}
    examples:
      - what's the weather
      - what's the weather in Austin
      - is it going to rain tomorrow in Boston
      - how cold is it outside
      - should I bring a jacket tomorrow
      - do I need an umbrella today
      - is it hot out right now
      - what's it like outside
      - is it warm out there
      - what's the temperature out
      - is it nice out today

  get_news:
    bucket: data
    handler: registry
    tool: get_news
    side_effects: false
    canonical: what's in the news
    description: Latest headlines, optionally by topic.
    slots:
      topic: {type: enum, required: false, values: [top, tech, science, business, sports, world], description: "News topic"}
      count: {type: integer, required: false, description: "1-5 headlines"}
    examples:
      - what's in the news
      - give me five tech headlines
      - any sports news
      - what's happening in the world
      - catch me up on current events
      - anything going on today
      - what's the latest
      - any breaking news
      - bring me up to speed on the news
      - anything I should know about today
      - what's new in the headlines

  get_stock:
    bucket: data
    handler: registry
    tool: get_stock
    side_effects: false
    description: Price / chart for a stock, index, or crypto.
    slots:
      query: {type: string, required: true, description: "Company, ticker, or index"}
    examples:
      - what's Apple trading at
      - Tesla stock price
      - how's bitcoin doing
      - price of the S&P 500
      - what's NVIDIA worth right now

  get_system_info:
    bucket: data
    handler: registry
    tool: get_system_info
    side_effects: false
    canonical: system status
    description: This PC's CPU / memory / disk / uptime.
    slots:
      metric: {type: enum, required: false, values: [all, cpu, memory, disk, uptime], description: "Which stat"}
    examples:
      - how much RAM am I using
      - what's my CPU at
      - how long has my computer been running
      - system status
      - is my pc under load
      - how's my pc running
      - is my computer slow right now
      - check my cpu and memory
      - what's my resource usage
      - how's my machine holding up

  calculate:
    bucket: data
    handler: registry
    tool: calculate
    side_effects: false
    description: Evaluate a math expression.
    slots:
      expression: {type: string, required: true, description: "Math expression"}
    examples:
      - what's 18% of 240
      - calculate the square root of 1764
      - 12 times 9
      - 100 divided by 4

  lookup_fact:
    bucket: data
    handler: registry
    tool: lookup_fact
    side_effects: false
    description: Quick factual lookup (Wikipedia/DDG).
    slots:
      query: {type: string, required: true, description: "Thing to look up, filler stripped"}
    examples:
      - how many calories in a gallon of milk
      - how tall is Mount Everest
      - define entropy
      - how many planets are in the solar system

  scrape_url:
    bucket: data
    handler: registry
    tool: scrape_url
    side_effects: false
    description: Fetch and summarize a web page.
    slots:
      url: {type: string, required: true, description: "Full URL"}
    examples:
      - read https://example.com
      - what's on github.com/ninjahawk/Jarvis
      - summarize this page for me

  # ---- research -----------------------------------------------------------
  research:
    bucket: research
    handler: router
    tool: research
    side_effects: false
    description: Rich briefing card on an entity / topic.
    slots:
      query: {type: string, required: true, description: "Subject of the briefing"}
    examples:
      - tell me about the Eiffel Tower
      - who was Nikola Tesla
      - what is the speed of light
      - give me a rundown on quantum computing

  deep_research:
    bucket: research
    handler: router
    tool: deep_research
    side_effects: false
    description: Multi-source background research; pops several cards then a synthesis.
    slots:
      query: {type: string, required: true, description: "Subject to research"}
    examples:
      - research the history of the Roman empire
      - deep dive on lithium battery recycling
      - investigate the 2008 financial crisis

  # ---- media --------------------------------------------------------------
  search_images:
    bucket: media
    handler: registry
    tool: search_images
    side_effects: false
    description: Live image search shown as a photo grid.
    slots:
      query: {type: string, required: true, description: "What to find pictures of"}
      count: {type: integer, required: false, description: "1-30 images"}
    examples:
      - show me a picture of a corgi
      - what does the Aurora Borealis look like
      - pictures of vintage motorcycles

  show_subject:
    bucket: media
    handler: router
    tool: show_subject
    side_effects: false
    canonical: show me
    description: Bare visual follow-up — images of the most recent subject.
    slots: {}
    examples:
      - show me
      - show me more
      - let me see it
      - let me see what it looks like

  play_music:
    bucket: media
    handler: connector
    tool: music.start
    side_effects: true
    description: Start the user's music.
    slots: {}
    examples:
      - start my music
      - put on some music
      - play some music
      - fire up some tunes

  media_control:
    bucket: media
    handler: connector
    tool: media.control
    side_effects: true
    description: Transport controls — play/pause/stop/next/previous.
    slots:
      action: {type: enum, required: true, values: [play, pause, stop, next, prev], description: "Transport action"}
    examples:
      - pause the music
      - skip this song
      - next track
      - go back a song
      - resume

  volume_control:
    bucket: media
    handler: connector
    tool: volume.control
    side_effects: true
    description: System volume up/down/mute.
    slots:
      action: {type: enum, required: true, values: [up, down, mute, unmute], description: "Volume action"}
    examples:
      - turn it up
      - lower the volume
      - mute the sound
      - make it louder

  play_game:
    bucket: media
    handler: router
    tool: play_game
    side_effects: false
    description: Launch a self-hosted HTML5 game in a HUD panel.
    slots:
      game: {type: enum, required: true, values: [snake, pong, "2048"], description: "Which game"}
    examples:
      - play snake
      - let's play 2048
      - launch pong

  # ---- desktop ------------------------------------------------------------
  screenshot:
    bucket: desktop
    handler: router
    tool: screenshot
    side_effects: false
    canonical: take a screenshot
    description: Capture the desktop and show it (mobile panel) / save it (desktop).
    slots: {}
    examples:
      - take a screenshot
      - show me my screen
      - what's on my screen
      - what are you looking at
      - mirror my desktop
      - send me my screen
      - grab my screen
      - snapshot the desktop
      - let me see the display

  open_app_or_site:
    bucket: desktop
    handler: connector
    tool: open.target
    side_effects: true
    description: Open a saved site, a URL, or a named app.
    slots:
      target: {type: string, required: true, description: "Site/app name or URL"}
    examples:
      - open reddit
      - pull up my email
      - go to youtube.com
      - launch spotify

  open_chat:
    bucket: desktop
    handler: router
    tool: open_chat
    side_effects: false
    canonical: open chat
    description: Open the typed chat HUD.
    slots: {}
    examples:
      - open chat
      - let me type
      - bring up a chat window
      - open the keyboard
      - I want to type to you

  graph:
    bucket: desktop
    handler: router
    tool: graph
    side_effects: false
    description: Build an (estimated) data chart for non-stock series.
    slots:
      query: {type: string, required: true, description: "What to chart"}
    examples:
      - graph YouTube revenue over time
      - chart world population by year
      - plot Tesla deliveries per year

  # ---- productivity -------------------------------------------------------
  add_note:
    bucket: productivity
    handler: registry
    tool: add_note
    side_effects: true
    description: Save a note / reminder.
    slots:
      text: {type: string, required: true, description: "Note content"}
      tag: {type: string, required: false, description: "Optional one-word category"}
    examples:
      - remember that I love mango lassi
      - note that the door code is 1234
      - jot down call the dentist

  list_notes:
    bucket: productivity
    handler: registry
    tool: list_notes
    side_effects: false
    canonical: what are my notes
    description: Read back saved notes.
    slots:
      limit: {type: integer, required: false, description: "How many, newest first"}
    examples:
      - what are my notes
      - what's on my list
      - read back my notes
      - go over my notes
      - what did I write down

  search_notes:
    bucket: productivity
    handler: registry
    tool: search_notes
    side_effects: false
    description: Find a note by text.
    slots:
      query: {type: string, required: true, description: "Search text"}
    examples:
      - find my notes about lassi
      - search my notes for the door code

  read_file:
    bucket: productivity
    handler: registry
    tool: read_file
    side_effects: false
    description: Read a file from the JARVIS_Files sandbox.
    slots:
      name: {type: string, required: true, description: "Filename in JARVIS_Files"}
    examples:
      - read me the file called groceries.txt
      - open my file notes.md

  write_file:
    bucket: productivity
    handler: registry
    tool: write_file
    side_effects: true
    description: Write a file in the JARVIS_Files sandbox.
    slots:
      name: {type: string, required: true, description: "Filename"}
      content: {type: string, required: true, description: "Text to write"}
    examples:
      - save a file called ideas.txt with my brainstorm
      - write this down to a file

  list_files:
    bucket: productivity
    handler: registry
    tool: list_files
    side_effects: false
    canonical: list my jarvis files
    description: List files in the JARVIS_Files sandbox.
    slots:
      subfolder: {type: string, required: false, description: "Optional subfolder"}
    examples:
      - list my JARVIS files
      - what files do I have
      - show my files
      - what's in my jarvis folder

  # ---- conversation -------------------------------------------------------
  conversation:
    bucket: conversation
    handler: router
    tool: chat
    side_effects: false
    description: Smalltalk / anything with no tool — free conversation.
    slots: {}
    examples:
      - how are you
      - tell me a joke
      - good morning
      - that was funny
      - thanks
